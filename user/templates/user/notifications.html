{% extends 'base.html' %}

{% block title %}{{ super() }} - Notifications{% endblock title %}

{% block scripts %}
    <script src="{{ url_for('static', filename='lib/purify-3.4.15/js/purify.min.js') }}"></script>
    <script src="{{ url_for('user_bp.static', filename='js/notifications.js') }}"></script>
{% endblock scripts %}

{% block content %}
    <div class="row">
        <div class="col-md-8">
            <h1>Notifications</h1>
        </div>
        <div id="notification-tools" class="col-md-4 hidden">
            <button type="button" class="btn btn-primary float-end mt-2" id="notifications_dismiss_all" title="Mark all done">
                Mark all done <i class="fa-solid fa-check" aria-hidden="true"></i>
            </button>

            <div class="dropdown show float-end mt-2 me-2">
                <button type="button" class="btn btn-secondary dropdown-toggle" id="sortMenu" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    Sort order
                </button>
                <div class="dropdown-menu" aria-labelledby="sortMenu">
                    <a class="dropdown-item" href="{{ url_for('user_bp.notifications', sort_order="desc") }}">Newest first</a>
                    <a class="dropdown-item" href="{{ url_for('user_bp.notifications', sort_order="asc") }}">Oldest first</a>
                </div>
            </div>
        </div>
    </div>
    <div id="notifications" class="list-group"></div>
{% endblock content %}
